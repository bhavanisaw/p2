
<!DOCTYPE html>
<html>
<head>
    <title>Responsive University</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header, footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: black;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .container {
            display: flex;
        }

        main {
            flex: 3;
            padding: 20px;
        }

        aside {
            flex: 1;
            background: lightblue;
            padding: 20px;
        }

        @media(max-width:600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ABC University</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Facilities</a>
</nav>

<div class="container">

    <main>
        <h2>Welcome to University</h2>
        <p>Our university provides quality education and modern facilities.</p>
    </main>

    <aside>
        <h3>Facilities</h3>
        <ul>
            <li>Library</li>
            <li>Computer Lab</li>
            <li>Auditorium</li>
            <li>Sports Ground</li>
        </ul>
    </aside>

</div>

<footer>
    <p>Copyright 2026 ABC University</p>
</footer>

</body>
</html>
